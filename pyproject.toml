[project]
name = "steelenergy"
version = "0.1.0"
description = "Energy consumption analysis of a steel plant (UCI dataset, 2018)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyter>=1.0",
    "nbconvert>=7",
    "ipykernel>=6",
    "markdown-it-py>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steelenergy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Markdown prose for the notebook; wrapping it would change the rendered text.
"notebooks/build_notebook.py" = ["E501"]

[tool.uv]
# argon2-cffi-bindings 26.x (pulled in by Jupyter) ships no wheel for Intel macOS; keep that one
# platform on 25.x so `uv sync` never has to compile it.
constraint-dependencies = [
    "argon2-cffi-bindings<26; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
