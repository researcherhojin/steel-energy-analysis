# Rebuild the report and dashboard from the raw CSV and publish them to GitHub Pages.
# The build runs on Apple Silicon macOS: the boosted-tree and isolation-forest results differ in
# the last digits across OS/CPU, and README's numbers were produced there. The tests (which compare
# README with a fresh pipeline run) gate the deploy, so the site never disagrees with README.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python -m steelenergy.pipeline
      - run: uv run python web/build.py
      - run: uv run python web/pages.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
